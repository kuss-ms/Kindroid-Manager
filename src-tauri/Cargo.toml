[package]
name = "kindroid-manager"
version = "0.5.0"
description = "Local authoring & push tool for Kindroid personas."
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kindroid_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
flate2 = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
